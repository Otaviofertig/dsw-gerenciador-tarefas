<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Gerenciado de Tarefas</title>
    
</head>
<body>
    <header>
        <h1 class="bg-red-300 text-3xl font-semibold text-stone-800 tracking-tight m-10 p-8 w-200 text-center">Site Web</h1>
    <main>

        <section class="text-center">
            <h2>Criar uma nova tarefa</h2>
            <form>
                <div>
                    <label for="input-titulo">Titulo da Atividade</label>
                    <input type="text" id="input-titulo" placeholder="Porno Gay" required>
                </div>
                <div>
                    <label for="select-prioridade">Prioridade: </label>
                    <select id="select-prioridade"> 
                        <option value="low">Baixo</option>
                        <option value="medium">Médio</option>
                        <option value="high">Alto</option>
                    </select>
                </div>
                <button type="submit">Cadastrar</button>
            </form>
        </section>

        <section>
            <h2>Minhas Tarefas</h2>
            <div>
                <input type="checkbox">
                <h4>Estudar para a prova de Web</h4>
            </div>
        </section>

    </main>

    <footer>Desenvolvimento de Sistemas Web - 2026 &copy</footer>
</body>
</html>
