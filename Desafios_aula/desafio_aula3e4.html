<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Card Responsivo</title>
    <!-- Tailwind CSS via Play CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gradient-to-r from-blue-200 via-purple-200 to-pink-200 min-h-screen font-sans antialiased flex items-center justify-center p-4">

    <!-- CARD CONTAINER -->
    <div class="max-w-xl w-full bg-white border border-slate-200/80 rounded-2xl shadow-xl p-6 md:p-8 transition-all hover:shadow-2xl">
        
        <!-- LAYOUT CONTAINER (flex-col no mobile, flex-row a partir do breakpoint md) -->
        <div class="flex flex-col md:flex-row items-center md:items-start gap-6">
            
            <!-- AVATAR -->
            <div id="img" class="w-20 h-20 shrink-0 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-600 text-white font-bold text-2xl flex items-center justify-center shadow-md ring-4 ring-blue-50">
                JS
            </div>

            <!-- INFORMAÇÕES DO DEPOIMENTO -->
            <div class="flex flex-col items-center md:items-start text-center md:text-left gap-3">
                
                <!-- CARGO (TAG) -->
                <span class="inline-block text-xs font-bold uppercase tracking-wider text-blue-600 bg-blue-50 border border-blue-200/60 px-3 py-1 rounded-full">
                    Desenvolvedor Front-end
                </span>

                <!-- NOME -->
                <h2 class="text-2xl font-bold text-slate-800 tracking-tight">
                    João Silva
                </h2>

                <!-- CITACAO -->
                <p class="text-slate-600 italic text-sm md:text-base leading-relaxed">
                    "O segredo de uma interface incrível não está nas cores, mas no domínio absoluto do espaçamento e da hierarquia visual."
                </p>

                <!-- BOTÃO -->
                <button class="mt-2 w-full md:w-auto bg-slate-900 hover:bg-blue-600 text-white font-medium text-sm px-6 py-2.5 rounded-xl shadow-md hover:shadow-lg transition-all duration-200 cursor-pointer">
                    Ver Perfil
                </button>
                
            </div>
            
        </div>
    </div>

</body>

</html>
