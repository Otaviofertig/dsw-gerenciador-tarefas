<title id="t">Gerenciador de Tarefas</title>
<desc id="d">Banner animado: o título do projeto, as tecnologias sendo digitadas e uma lista de tarefas que vai sendo concluída sozinha.</desc>

  <style>
    @keyframes surge { from { opacity: 0; transform: translateY(var(--dy)); } to { opacity: 1; transform: none; } }
