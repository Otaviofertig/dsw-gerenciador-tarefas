<circle cx="134" cy="64" r="4.5" fill="#22c55e"><animate attributeName="opacity" values="1;0.2;1" dur="1.50s" repeatCount="indefinite"/></circle>
<rect x="0" y="92" width="150" height="36" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
<rect x="16" y="107" width="70" height="6" rx="3" fill="#22c55e" opacity="0.35"/>
<circle cx="118" cy="110" r="4.5" fill="#22c55e"><animate attributeName="opacity" values="1;0.2;1" dur="1.60s" repeatCount="indefinite"/></circle>
<circle cx="134" cy="110" r="4.5" fill="#22c55e"><animate attributeName="opacity" values="1;0.2;1" dur="1.85s" repeatCount="indefinite"/></circle>
</g></g>
