<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="t d">
<title id="t">Guia de estudos</title>
<desc id="d">Os conceitos do back-end explicados com calma</desc>

  <style>
    @keyframes surge { from { opacity: 0; transform: translateY(var(--dy)); } to { opacity: 1; transform: none; } }
    @keyframes flutua { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes gira { to { transform: rotate(360deg); } }
    @keyframes pulsa { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    .flutua { animation: flutua 4s ease-in-out infinite; }
  </style>

  <defs>
    <linearGradient id="bgguia" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1004"/>
      <stop offset="1" stop-color="#3a2308"/>
    </linearGradient>
    <pattern id="gradeguia" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="blurguia" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
    <clipPath id="bordaguia"><rect width="1200" height="240" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#bordaguia)">
    <rect width="1200" height="240" fill="url(#bgguia)"/>
    <rect width="1200" height="240" fill="url(#gradeguia)"/>
    <circle cx="216" cy="48" r="108" fill="#fcd34d" opacity="0.35" filter="url(#blurguia)">
      <animate attributeName="cx" values="216;384;216" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="216" r="120" fill="#f59e0b" opacity="0.3" filter="url(#blurguia)">
      <animate attributeName="cy" values="216;132;216" dur="11s" repeatCount="indefinite"/>
    </circle>
  </g>
<g style="animation: surge 0.7s ease-out 0.1s both; --dy: 14px"><text x="60" y="66" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="3" fill="#fcd34d">PARA REVISAR</text></g>
<g style="animation: surge 0.8s ease-out 0.3s both; --dy: 18px"><text x="58" y="132" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" fill="#fff">Guia de estudos</text></g>
<rect x="60" y="150" width="0" height="5" rx="2.5" fill="#fcd34d"><animate attributeName="width" values="0;140" begin="0.6s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect>
<g style="animation: surge 0.7s ease-out 0.9s both; --dy: 14px"><text x="60" y="194" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#cbd5e1">Os conceitos do back-end explicados com calma</text></g>
<g style="animation: surge 0.9s ease-out 0.5s both; --dy: 24px"><g transform="translate(1030 110)">
    <circle cx="0" cy="0" r="70" fill="#f59e0b" opacity="0.25"><animate attributeName="r" values="58;78;58" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.4;0.15" dur="3s" repeatCount="indefinite"/></circle>
    <path d="M-34 -8 A34 34 0 1 1 34 -8 C34 10 20 18 18 34 H-18 C-20 18 -34 10 -34 -8 Z" fill="#fde68a" stroke="#f59e0b" stroke-width="3"/>
    <rect x="-18" y="38" width="36" height="9" rx="3" fill="#cbd5e1"/><rect x="-14" y="50" width="28" height="9" rx="3" fill="#94a3b8"/>
    <path d="M-10 24 V2 L0 12 L10 2 V24" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round"/>
  </g></g>
</svg>